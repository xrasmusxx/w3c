<!DOCTYPE html>
<html lang="et">
<head>

    <title>Minu veebileht</title>

    <style>

            margin: 0;
            font-family: Arial, sans-serif;

        nav {

    </section>

    <section>

        <ul>
            <li>Veebilehtede ehitamine  </li>
